name: FrutiDry quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify assets, references and JavaScript syntax
        run: python3 tests/validate_repo.py
      - name: Tournament schedule and ranking policy tests
        run: node --test tests/tournament.test.mjs
      - name: Tournament operator draft and schedule tests
        run: node --test tests/tournament-operations.test.mjs
      - name: PayPal Payouts draft and settlement status tests
        run: node --test tests/paypal-payouts.test.mjs
      - name: Permanent accounts and REST authentication contract tests
        run: node --test tests/account-api.test.mjs
      - name: Shared deterministic RNG, circuit geometry and viewport contracts
        run: node --test tests/simulation-core.test.mjs
      - name: Server-owned run sessions and unverified diagnostic intake
        run: node --test tests/run-intake.test.mjs
      - name: Deterministic projectile and ammunition parity against V43
        run: node --test tests/simulation-stage2.test.mjs
      - name: Shared scoring, damage and fusion parity against V44
        run: node --test tests/simulation-stage3.test.mjs
      - name: Headless browser-to-Node full-run replay verification (no XP)
        run: node --test tests/headless-replay.test.mjs
      - name: Headless VM loads competitive viewport with no preview mode
        run: node --test tests/headless-viewport-compat.test.mjs
      - name: Isolated replay subprocess, bounded queue and fail-closed outcomes
        run: node --test tests/isolated-verifier.test.mjs
      - name: Atomic verification leases, stored session ownership and zero XP
        run: node --test tests/run-verification.test.mjs
      - name: Fixed logical 390x844 viewport and pointer mapping contracts (preview only)
        run: node --test tests/competitive-viewport.test.mjs
      - name: Web account contract and API transport tests
        run: node --test tests/account-client.test.mjs
      - name: Email verification flow and token-claim protection (Firebase beta)
        run: node --test tests/account-email-verification.test.mjs
      - name: V50 account token recovery and race-safe sessions
        run: node --test tests/account-session.test.mjs
      - name: V50 offline beta readiness and fail-closed deployment contracts
        run: node --test tests/beta-readiness.test.mjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools (not game dependencies)
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run browser-level regressions and real-storage tests
        run: python tests/browser_qa.py
      - name: Account UI, pause and SDK-off responsive tests
        run: python tests/account-browser-qa.py
      - name: Verification UI in Chromium without Firebase network
        run: python tests/account-verification-browser-qa.py
      - name: Real-browser QA for logical viewport preview and normal play
        run: python tests/viewport-browser-qa.py
      - name: V50 session token renewal and logout behavior in Chromium
        run: python tests/account-session-browser-qa.py
