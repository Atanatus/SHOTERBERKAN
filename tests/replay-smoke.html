<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrutiDry · Pruebas de reproducción</title>
<style>
  :root{color-scheme:dark;font:16px system-ui}
  body{max-width:800px;margin:3rem auto;padding:0 1rem;background:#0c1323;color:#e3f2ff}
  h1{font-size:1.3rem}
  output{display:block;white-space:pre-wrap;line-height:1.8;border:1px solid #456;border-radius:10px;padding:1rem;background:#111b32}
  iframe{position:absolute;left:-9999px;top:0;width:390px;height:844px;border:0}
  .note{color:#a5bfcd;font-size:.9rem}
</style>
</head>
<body>
<h1>FrutiDry · Pruebas de motor V31</h1>
<p class="note">Ejecuta el motor real en un marco aislado. No modifica el repositorio ni guarda resultados permanentes.</p>
<output id="results">Cargando juego…</output>
<iframe id="game" src="../index.html" title="Motor bajo prueba"></iframe>
<script>
'use strict';
const frame=document.getElementById('game');
const output=document.getElementById('results');
frame.addEventListener('load',()=>{
  const outcomes=[];
  const verify=(title,script,accept)=>{
    try{
      const result=frame.contentWindow.eval(script);
      if(!accept(result))throw Error(JSON.stringify(result));
      outcomes.push(`✓ ${title}`);
    }catch(e){outcomes.push(`✕ ${title}: ${e.message}`);}
    output.textContent=outcomes.join('\n');
  };
  verify('Reproducción exacta de 275 pasos',`(()=>{
    setTab('play');resetGame(24681357);
    for(let i=0;i<30;i++)update();
    state.aimAngle=.238734123;state.isAiming=true;
    for(let i=0;i<17;i++)update();
    state.isAiming=false;shoot();
    for(let i=0;i<85;i++)update();
    swapActiveAndUpcoming();
    for(let i=0;i<18;i++)update();
    state.aimAngle=-.14397365;shoot();
    for(let i=0;i<125;i++)update();
    const trace=ContinuityLab.captureRun();
    ReplayLab.begin(trace);
    for(let i=0;i<trace.stats.simFrame&&state.replayActive;i++){
      update();ReplayLab.afterStep();
    }
    return {steps:trace.stats.simFrame,
      matches:JSON.stringify(ReplayLab.snapshot())===JSON.stringify(trace.checkpoint),
      status:document.getElementById('replayStatus').textContent};
  })()`,r=>r.steps===275&&r.matches&&r.status.includes('VERIFICADO'));
  verify('Final prematuro detectado',`(()=>{
    setTab('play');resetGame(1977);for(let i=0;i<10;i++)update();
    const data=ContinuityLab.captureRun();ReplayLab.begin(data);
    state.gameOver=true;ReplayLab.afterStep();
    return {active:state.replayActive,applying:ReplayLab.isApplying(),
      status:document.getElementById('replayStatus').textContent,
      visible:document.getElementById('auditHash').textContent};
  })()`,r=>!r.active&&!r.applying&&r.status.includes('partida terminada')&&r.visible.includes('partida terminada'));
  verify('La excepción no deja abierto el permiso de acción',`(()=>{
    setTab('play');resetGame(3759);state.aimAngle=.15;shoot();
    for(let i=0;i<45;i++)update();
    const data=ContinuityLab.captureRun();ReplayLab.begin(data);
    const original=window.shoot;
    try{window.shoot=()=>{throw Error('excepción de prueba')};update();}
    finally{window.shoot=original;}
    return {active:state.replayActive,applying:ReplayLab.isApplying(),
      status:document.getElementById('replayStatus').textContent};
  })()`,r=>!r.active&&!r.applying&&r.status.includes('excepción de prueba'));
  verify('Primer input registrado tras reiniciar ritual',`(()=>{
    setTab('play');resetGame(1234);
    state.aimAngle=.2;state.isAiming=true;
    for(let i=0;i<12;i++)update();
    resetGame(1234);
    state.aimAngle=.2;state.isAiming=true;
    for(let i=0;i<12;i++)update();
    const data=ContinuityLab.captureRun();
    ReplayLab.begin(data);
    for(let i=0;i<data.stats.simFrame&&state.replayActive;i++){
      update();ReplayLab.afterStep();
    }
    return {first:data.inputs[0],status:document.getElementById('replayStatus').textContent};
  })()`,r=>r.first?.s===0&&r.first.v[1]===1&&r.status.includes('VERIFICADO'));
  verify('Cambio de viewport detiene el replay',`(()=>{
    setTab('play');resetGame(2345);
    for(let i=0;i<12;i++)update();
    const data=ContinuityLab.captureRun();
    ReplayLab.begin(data);
    const oldWidth=width;
    try {width+=1;update();}
    finally {width=oldWidth;}
    return {active:state.replayActive,status:document.getElementById('replayStatus').textContent};
  })()`,r=>!r.active&&r.status.includes('tamaño del tablero modificado'));
  verify('Checkpoints periódicos detectan divergencia en paso 600',`(()=>{
    setTab('play');resetGame(2901);
    for(let i=0;i<760;i++){update();ReplayLab.afterStep();}
    const data=ContinuityLab.captureRun();
    const positions=data.checkpoints.map(c=>c.s);
    data.checkpoints[0].state.score+=7;
    ReplayLab.begin(data);
    for(let i=0;i<data.stats.simFrame&&state.replayActive;i++){
      update();ReplayLab.afterStep();
    }
    return {positions,active:state.replayActive,status:document.getElementById('replayStatus').textContent};
  })()`,r=>r.positions.join(',')==='600'&&!r.active&&r.status.includes('checkpoint en paso 600'));
  verify('Diagnósticos V24 sin checkpoints siguen funcionando',`(()=>{
    setTab('play');resetGame(2902);
    for(let i=0;i<620;i++){update();ReplayLab.afterStep();}
    const data=ContinuityLab.captureRun();
    delete data.checkpoints;
    ReplayLab.begin(data);
    for(let i=0;i<data.stats.simFrame&&state.replayActive;i++){
      update();ReplayLab.afterStep();
    }
    return {active:state.replayActive,status:document.getElementById('replayStatus').textContent};
  })()`,r=>!r.active&&r.status.includes('VERIFICADO'));
  verify('Rechazo de checkpoints desordenados',`(()=>{
    setTab('play');resetGame(2903);
    for(let i=0;i<1250;i++){update();ReplayLab.afterStep();}
    const data=ContinuityLab.captureRun();
    data.checkpoints.reverse();
    let rejected=false;
    try{ReplayLab.validate(data);}catch(e){rejected=e.message.includes('periódico inválido');}
    return {count:data.checkpoints.length,rejected};
  })()`,r=>r.count===2&&r.rejected);
  verify('Efectos acotados tras ráfaga de 100 impactos',`(()=>{
    setTab('play');resetGame(9600);
    for(let i=0;i<100;i++){
      spawnDopamineBurst(100,100,'#ff44aa',1.8);
      spawnParticles(120,110,'#ffeecc',40);
      addFloatingText(100,90,'+100','#ffffff',true);
    }
    return {particles:state.particles.length,shockwaves:state.shockwaves.length,
      starbursts:state.starbursts.length,texts:state.floatingTexts.length};
  })()`,r=>r.particles===240&&r.shockwaves===24&&r.starbursts===12&&r.texts===24);
  verify('Entradas acotadas y diagnóstico parcial no reproducible',`(()=>{
    setTab('play');resetGame(9601);
    state.inputLog.length=25000;
    state.aimAngle=.5;
    ReplayLab.beforeStep();
    const run=ContinuityLab.captureRun();
    let rejected=false;
    try{ReplayLab.validate(run);}catch(e){rejected=e.message.includes('incompleto');}
    const ok={count:state.inputLog.length,incomplete:state.traceIncomplete,
      reason:run.recording.reason,rejected};
    resetGame(9601);
    return ok;
  })()`,r=>r.count===25000&&r.incomplete&&r.rejected&&r.reason.includes('entradas'));
  verify('Límite de acciones, partida y reinicio',`(()=>{
    setTab('play');resetGame(9602);
    state.actionLog.length=15000;
    recordReplayAction({s:0,a:'swap'});
    const blocked=state.actionLog.length===15000&&state.traceIncomplete;
    const diag=ContinuityLab.captureRun();
    resetGame(9602);
    const restarted=!state.traceIncomplete&&state.actionLog.length===0;
    state.simFrame=216000;
    ReplayLab.beforeStep();
    const duration=state.traceIncomplete&&state.traceTruncationReason.includes('duración');
    resetGame(9602);
    return {blocked,restarted,duration,complete:diag.recording.complete};
  })()`,r=>r.blocked&&r.restarted&&r.duration&&r.complete===false);
  verify('Simulación prolongada de 30.000 pasos y checkpoints estables',`(()=>{
    setTab('play');resetGame(9603);
    for(let i=0;i<30000;i++){update();ReplayLab.afterStep();}
    const data=ContinuityLab.captureRun();
    return {steps:state.simFrame,checkpoints:state.traceCheckpoints.length,
      traceComplete:data.recording.complete,last:state.traceCheckpoints.at(-1)?.s,
      limitsOK:state.inputLog.length<=25000&&state.actionLog.length<=15000};
  })()`,r=>r.steps===30000&&r.checkpoints===50&&r.last===30000&&r.traceComplete&&r.limitsOK);
  output.textContent=outcomes.join('\n')+'\n\n'+(outcomes.every(x=>x.startsWith('✓'))?'TODAS LAS PRUEBAS SUPERADAS':'HAY PRUEBAS FALLIDAS');
});
</script>
</body>
</html>
